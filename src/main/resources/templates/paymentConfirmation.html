<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            color: #4CAF50; /* Green for confirmation */
        }
        .content {
            margin: 20px 0;
        }
        .footer {
            font-size: 0.9em;
            color: #888;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        strong {
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Payment Confirmation</h2>
    <p>Dear <span th:text="${customerName}"></span>,</p>

    <div class="content">
        <p>Thank you for your payment. Here are the details of your order:</p>
        <ul>
            <li><strong>Order Reference:</strong> <span th:text="${orderRef}"></span></li>
            <li><strong>Total Amount:</strong> $<span th:text="${totalAmount}"></span></li>
        </ul>
    </div>

    <p>If you have any questions, feel free to contact us at
        <a href="mailto:contact@btb.com" style="color: #4CAF50; text-decoration: none;">contact@btb.com</a>.
    </p>

    <div class="footer">
        <p>Best regards,<br>BTB E-Commerce Team</p>
    </div>
</div>
</body>
</html>
